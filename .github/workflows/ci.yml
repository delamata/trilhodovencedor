name: CI

on:
  push:
    branches: [master]
  pull_request:

# Valores placeholder — o build/lint/test não conecta de verdade no
# Supabase (nenhuma rota estática executa código de servidor durante
# `next build`), então não é preciso configurar segredos reais aqui.
# Os testes de integração (npm run test:integration) precisam de
# credenciais reais e de propósito NÃO rodam neste workflow — veja o
# README, seção Testes.
env:
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
  NEXT_PUBLIC_APP_TIMEZONE: America/Sao_Paulo
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  build:
    name: Lint, typecheck, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes unitários
        run: npm run test

      - name: Build de produção
        run: npm run build

  e2e:
    name: Testes E2E (Playwright)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps chromium

      - name: Rodar testes E2E
        run: npx playwright test --project=chromium

      - name: Publicar relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
